name: Optional Visual FreeCamera ABI client smoke (no release)
on:
  push:
    branches: [feature/visual-freecamera-abi-client, work/next-cinematic-recovery]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camera-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  camera-client-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686-posix
      - name: Check portable ABI structures
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ivendor tests/visual_camera_api_test.cpp -o /tmp/visual-camera-api
          /tmp/visual-camera-api
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-misleading-indentation -Isrc -Ivendor tests/folia_protocol_test.cpp -o /tmp/folia-protocol
          /tmp/folia-protocol
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-misleading-indentation -Isrc tests/cinematic_camera_test.cpp -o /tmp/cinematic-camera
          /tmp/cinematic-camera
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-misleading-indentation -Isrc -Ivendor tests/settings_lifecycle_test.cpp -o /tmp/settings-lifecycle
          /tmp/settings-lifecycle
          g++ -std=c++17 -Wall -Wextra -Werror -Wno-misleading-indentation -Isrc -Ivendor tests/menu_navigation_test.cpp -o /tmp/menu-navigation
          /tmp/menu-navigation
          python3 scripts/generate_factory_defaults.py --check
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/hud_menu_policy_test.cpp -o /tmp/camera-menu
          /tmp/camera-menu
      - name: Build optional camera client caller and plugin
        env:
          DANGO_CXX: i686-w64-mingw32-g++-posix
        run: |
          bash scripts/build-mingw.sh
          file build/L4D2DangoMusic.dll
          test -f build/visual_camera_client_win32_smoke.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DangoMusic-VisualCamera-Client-Preview
          path: |
            build/L4D2DangoMusic.dll
          if-no-files-found: error
