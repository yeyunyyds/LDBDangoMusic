name: Native Folia + AFK cinematic preview
on:
  push:
    branches: [feature/visual-freecamera-abi-client]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-folia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686-posix
      - name: Native regression tests
        run: bash scripts/test.sh
      - name: Build L4N x86 plugin
        env:
          DANGO_CXX: i686-w64-mingw32-g++-posix
        run: bash scripts/build-mingw.sh
      - name: Package native Folia preview (single DLL)
        run: python3 scripts/package.py --variant folia-stage
      - uses: actions/upload-artifact@v4
        with:
          name: folia-stage-cinematic-preview
          path: |
            build/packages/*-folia-stage.zip
            build/packages/*-folia-stage.zip.sha256
          if-no-files-found: error
